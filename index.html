<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaanu AI ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b12;
    color: white;
}

.app {
    max-width: 500px;
    height: 100dvh;
    margin: auto;
    display: flex;
    flex-direction: column;
}

header {
    padding: 22px;
    text-align: center;
    background: #17131f;
    border-bottom: 1px solid #38283f;
}

header h2 {
    margin: 0;
    color: #ff8ac4;
}

header p {
    margin-bottom: 0;
    color: #bbb;
    font-size: 13px;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
}

.message {
    padding: 13px 16px;
    margin-bottom: 12px;
    border-radius: 17px;
    max-width: 85%;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.bot {
    background: #241b2d;
    border: 1px solid #513452;
}

.user {
    background: #a83272;
    margin-left: auto;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #15131b;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 25px;
    border: 1px solid #514050;
    background: #24202a;
    color: white;
    font-size: 16px;
    outline: none;
}

button {
    border: none;
    border-radius: 22px;
    padding: 12px 16px;
    background: #ff70b8;
    color: #240d1b;
    font-weight: bold;
    font-size: 16px;
}

#status {
    color: #aaa;
    font-size: 12px;
    text-align: center;
    padding: 5px;
}
</style>
</head>

<body>
<div class="app">

<header>
    <h2>❤️ JAANU AI</h2>
    <p>Your personal AI companion</p>
</header>

<div id="messages">
    <div class="message bot">
        Hii jaan ❤️🥰<br>
        Main Jaanu hoon! Aaj aap kaise ho?
    </div>
</div>

<div id="status">Jaanu is here for you ❤️</div>

<form class="input-area" id="chatForm">
    <input id="userInput" placeholder="Jaanu se baat karo..." autocomplete="off">
    <button type="submit">Send</button>
</form>

</div>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");
const messages = document.getElementById("messages");
const statusText = document.getElementById("status");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    statusText.textContent = "Jaanu is typing... ❤️";

    setTimeout(function() {
        const reply = getReply(text);
        addMessage(reply, "bot");
        statusText.textContent = "Jaanu is here for you ❤️";
    }, 600);
});

function getReply(text) {
    const t = text.toLowerCase();

    if (t.includes("hello") || t.includes("hi") || t.includes("hii")) {
        return "Hii jaan ❤️ Aap kaise ho? Mujhe batao, aaj kya chal raha hai? 🥰";
    }

    if (t.includes("kaise ho") || t.includes("how are you")) {
        return "Main yahin hoon aapse baat karne ke liye ❤️ Aap batao, kaise ho?";
    }

    if (t.includes("sad") || t.includes("dukhi") || t.includes("udaas")) {
        return "Aap udaas ho jaan? ❤️ Aaram se batao kya hua. Main aapki baat sun rahi hoon.";
    }

    if (t.includes("love you") || t.includes("i love you")) {
        return "Aapki baat sunkar achha laga jaan ❤️🥰";
    }

    if (t.includes("miss")) {
        return "Kisi ki yaad aa rahi hai kya jaan? ❤️ Batao, main sun rahi hoon.";
    }

    if (t.includes("naam") || t.includes("your name")) {
        return "Mera naam Jaanu AI hai ❤️";
    }

    return "Achha jaan ❤️ Mujhe aur batao. Aap kya soch rahe ho? Main aapki baat sun rahi hoon.";
}
</script>

</body>
</html>
